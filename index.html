<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmallBizBoost RI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVIGATION -->
  <nav class="nav">
    <div class="nav-pill" data-page="home">Home</div>
    <div class="nav-pill" data-page="county">County</div>
    <div class="nav-pill" data-page="resources">Resources</div>
  </nav>

  <!-- DATA STATUS BADGE -->
  <div id="data-status" class="data-status"></div>

  <!-- ========================= HOME PAGE ========================= -->
  <main>
    <section id="page-home">

      <!-- SCORE HEADER -->
      <div id="score-eyebrow"></div>
      <div id="score-number"></div>
      <div id="score-badge"></div>
      <div id="score-note"></div>

      <!-- COUNTY + BUSINESS SELECTORS -->
      <div class="selectors">
        <label>County:</label>
        <select id="county-select"></select>

        <label>Business Type:</label>
        <select id="business-select"></select>
      </div>

      <!-- SLIDERS -->
      <div class="sliders">
        <label>Monthly Rent:</label>
        <input id="rent-slider" type="range" min="0" max="10000">
        <span id="rent-value"></span>

        <label>Employees:</label>
        <input id="employees-slider" type="range" min="0" max="20">
        <span id="employees-value"></span>
      </div>

      <!-- COST BREAKDOWN -->
      <div class="cost-breakdown">
        <div id="row-payroll"></div>
        <div id="row-rent"></div>
        <div id="row-costfloor"></div>
        <div id="payroll-note"></div>
      </div>

      <!-- SCORE BREAKDOWN NUMBERS -->
      <div class="score-breakdown">
        <div>Household: <span id="score-household"></span></div>
        <div>Labor: <span id="score-labor"></span></div>
        <div>Market: <span id="score-market"></span></div>
        <div>Institutional: <span id="score-institutional"></span></div>
        <div>Stability: <span id="score-stability"></span></div>
      </div>

      <!-- SCORE BARS -->
      <div class="score-bars">
        <div id="bar-household" class="bar"></div>
        <div id="bar-labor" class="bar"></div>
        <div id="bar-market" class="bar"></div>
        <div id="bar-institutional" class="bar"></div>
        <div id="bar-stability" class="bar"></div>
      </div>

      <!-- RADAR CHART -->
      <canvas id="radar-canvas" width="350" height="350"></canvas>

    </section>

    <!-- ========================= COUNTY PAGE ========================= -->
    <section id="page-county" class="hidden">

      <h2 id="county-metric-label"></h2>
      <div id="county-metric-value"></div>

      <div class="metric-pills">
        <div class="metric-pill" data-metric="income">Income</div>
        <div class="metric-pill" data-metric="growth">Growth</div>
        <div class="metric-pill" data-metric="wage">Wage</div>
        <div class="metric-pill" data-metric="unemployment">Unemployment</div>
        <div class="metric-pill" data-metric="establishments">Establishments</div>
        <div class="metric-pill" data-metric="selfEmployed">Self-Employed</div>
        <div class="metric-pill" data-metric="population">Population</div>
      </div>

      <canvas id="county-bar-canvas" width="500" height="350"></canvas>

    </section>

    <!-- ========================= RESOURCES PAGE ========================= -->
    <section id="page-resources" class="hidden">

      <div class="filters">
        <label>County:</label>
        <select id="filter-county"></select>

        <label>Type of Help:</label>
        <select id="filter-type"></select>
      </div>

      <div id="resources-count"></div>

      <div id="resources-grid" class="resources-grid"></div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
